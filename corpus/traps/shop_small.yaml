# Semround trap corpus: orders and customers only, from shop.yaml.
# Parses in dbt v1.12 (shop.yaml does not: composite primary keys become two primary
# entities), so the dbt target can run its metrics end to end.
version: "0.1.1"
semantic_model:
- name: shop
  description: Orders, order lines, customers and products
  datasets:
  - name: orders
    source: shop.main.orders
    primary_key:
    - order_id
    fields:
    - name: order_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: order_id
      dimension:
        is_time: false
    - name: customer_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: customer_id
      dimension:
        is_time: false
    - name: status
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: status
      dimension:
        is_time: false
    - name: channel
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: LOWER(channel)
      dimension:
        is_time: false
    - name: ordered_at
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: ordered_at
      dimension:
        is_time: true
    - name: amount
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: amount
    - name: shipping_fee
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: shipping_fee
  - name: customers
    source: shop.main.customers
    primary_key:
    - customer_id
    fields:
    - name: customer_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: customer_id
    - name: region
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: region
      dimension:
        is_time: false
    - name: segment
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: segment || '-' || region
      dimension:
        is_time: false
    - name: signup_date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: signup_date
      dimension:
        is_time: true
  relationships:
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns:
    - customer_id
    to_columns:
    - customer_id
  metrics:
  - name: revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.amount)
  - name: completed_revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN orders.status = 'status_1' THEN orders.amount ELSE
          0 END)
  - name: order_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT orders.order_id)
  - name: avg_order_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(orders.amount + COALESCE(orders.shipping_fee, 0))
  - name: largest_order
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(orders.amount)
